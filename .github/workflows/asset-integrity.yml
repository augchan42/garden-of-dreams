name: Asset integrity
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'PR number to verify (maintainer path for forks; run from main)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Check out trusted base code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned transport
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/rclone.zip https://github.com/rclone/rclone/releases/download/v1.75.0/rclone-v1.75.0-linux-amd64.zip
          echo 'aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa  /tmp/rclone.zip' | sha256sum --check
          unzip -q /tmp/rclone.zip -d /tmp/garden-rclone
          echo '/tmp/garden-rclone/rclone-v1.75.0-linux-amd64' >> "$GITHUB_PATH"
      - name: Resolve PR and fetch Git objects without checkout
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PR: ${{ inputs.pull_request || github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_PR" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/$REQUESTED_PR" > /tmp/garden-pr.json
          python3 - <<'PY'
          import json,os,re
          data=json.load(open('/tmp/garden-pr.json'))
          assert data['base']['repo']['full_name']==os.environ['GITHUB_REPOSITORY']
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              for key in ('base','head'):
                  sha=data[key]['sha'];assert re.fullmatch(r'[0-9a-f]{40}',sha)
                  output.write(key+'='+sha+'\n')
          PY
          git -c core.hooksPath=/dev/null fetch --no-tags origin "refs/pull/$REQUESTED_PR/head:refs/asset-check/head"
      - name: Verify historical assets with scoped reader
        id: integrity
        env:
          R2_LFS_READER: ${{ secrets.R2_LFS_READER }}
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$R2_LFS_READER"
          python3 scripts/check_r2_history.py --base "$BASE_SHA" --head "$HEAD_SHA" --output /tmp/asset-integrity.json
      - name: Report status on PR head
        if: always() && steps.refs.outputs.head != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
          RESULT: ${{ steps.integrity.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          if [[ "$RESULT" == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" -f context='R2 asset integrity' \
            -f description='Full readback of newly introduced historical asset OIDs' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
